<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CORA-IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050b14; --panel:#0b1626; --line:#17304a; --ice:#d9f4ff; --mute:#7a95ad;
    --cy:#4fd8ff; --amber:#ffb347; --err:#ff8a8a; --hi:#fff;
    --font:'Rajdhani','Segoe UI',system-ui,sans-serif;
    color-scheme:dark; box-sizing:border-box;
    padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)); padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  }
  body[data-state=acting]{--cy:var(--amber)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(ellipse at 50% 26%,#0c2036 0,var(--ink) 62%);color:var(--ice);font:500 18px/1.4 var(--font);display:flex;flex-direction:column;align-items:center;overflow:hidden}
  header{width:100%;max-width:1000px;display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px}
  h1{margin:0;font-weight:600;font-size:24px;letter-spacing:.22em;color:var(--cy)}
  #status{color:var(--mute);font-size:16px}
  #ver{color:var(--mute);font-size:14px;cursor:pointer;letter-spacing:.04em}
  #ver:hover{color:var(--cy)}

  .mini{background:none;border:1px solid var(--line);color:var(--ice);border-radius:8px;padding:3px 12px;font:inherit;font-size:15px;cursor:pointer}
  .mini:hover{border-color:var(--cy);color:var(--cy)}
  .orb{width:54px;aspect-ratio:1;position:relative;display:grid;place-items:center;cursor:pointer;border-radius:50%;flex:none;border:0;background:none;padding:0;filter:drop-shadow(0 0 9px var(--cy))}
  .orb:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
  .ring{position:absolute;border-radius:50%}
  .r1{inset:0;border:2px solid transparent;border-top-color:var(--cy);border-bottom-color:var(--cy);animation:spin 10s linear infinite}
  .r2{inset:11%;border:2px dashed color-mix(in srgb,var(--cy) 55%,transparent);animation:spin 22s linear infinite reverse}
  .r3{inset:23%;border:3px solid transparent;border-left-color:var(--cy);border-right-color:var(--cy);animation:spin 6s linear infinite}
  .core{width:32%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--hi) 0,var(--ice) 22%,var(--cy) 58%,transparent 72%);box-shadow:0 0 20px var(--cy);animation:breathe 4s ease-in-out infinite}
  body[data-state=listening] .core{animation-duration:2.4s}
  body[data-state=thinking] .r1{animation-duration:2s}
  body[data-state=thinking] .r3{animation-duration:1.2s}
  body[data-state=speaking] .core{animation:talk .5s ease-in-out infinite}
  body[data-state=acting] .r2{animation-duration:3s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{50%{transform:scale(1.12);opacity:.85}}
  @keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
  @media (prefers-reduced-motion:reduce){.ring,.core{animation:none!important}}


  #log{width:100%;max-width:1000px;flex:1;min-height:0;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:10px}
  .line{max-width:92%;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
  .line.user{align-self:flex-end;color:var(--mute)}
  .line.jarvis{align-self:flex-start;border-color:color-mix(in srgb,var(--cy) 45%,var(--line))}
  .line.error{align-self:center;color:var(--err);border-color:var(--err);font-size:16px}
  .chip{align-self:flex-start;max-width:100%;font-size:15px;color:var(--amber);padding:2px 10px;border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:20px;overflow-wrap:anywhere}
  a.chip{text-decoration:underline}
  .chip.sim{color:var(--mute);border-color:var(--line)}

  form{width:100%;max-width:1000px;display:flex;gap:10px;padding:6px 20px 8px}
  input[type=text]{flex:1;min-width:0;background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit}
  button.btn{background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:10px;padding:0 18px;font:600 17px var(--font);cursor:pointer}
  button.btn:hover{border-color:var(--cy)}
  .opts{width:100%;max-width:1000px;display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 20px 14px;color:var(--mute);font-size:15px;align-items:center}
  .opts label{display:flex;gap:6px;align-items:center}
  .mini{background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:15px;flex:none}
  select{background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;font-size:15px;max-width:220px}
  .line{white-space:pre-wrap;overflow-wrap:anywhere}
  @media (max-width:600px){header{padding:10px 12px 4px}h1{font-size:20px}#log{padding:8px 12px}form{padding:6px 12px}.opts{padding:0 12px 10px;gap:6px 12px;font-size:14px}.line{max-width:96%}}
</style>
</head>
<body data-state="idle">
<header><div style="display:flex;gap:14px;align-items:center"><button class="orb" id="orb" aria-label="Interrumpir a CORA-IA"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span></button><h1 id="logo" style="user-select:none">CORA-IA</h1><span id="ver" title="Versión instalada (clic para buscar actualizaciones)"></span></div><span id="status" aria-live="polite">En espera</span></header>

<div id="log" aria-live="polite"></div>

<form id="form" autocomplete="off">
  <input type="text" id="text" placeholder="Escribe tu pregunta…" aria-label="Mensaje" autofocus>

</form>
<div class="opts">
  <label><input type="checkbox" id="mute"> Sin voz</label>

  <label id="kgroqRow" hidden>Clave Groq (oído del celular) <input type="password" id="kgroq" placeholder="gsk_…" autocomplete="off" aria-label="Clave de Groq" class="mini" style="width:150px"></label>
  <label>Clave Tavily (búsqueda más fiable, opcional) <input type="password" id="ktav" placeholder="tvly-…" autocomplete="off" aria-label="Clave de Tavily" class="mini" style="width:150px"></label>

    <option value="es-MX-DaliaNeural">Dalia · México · mujer</option><option value="es-MX-JorgeNeural">Jorge · México · hombre</option>
    <option value="es-NI-YolandaNeural">Yolanda · Nicaragua · mujer</option><option value="es-NI-FedericoNeural">Federico · Nicaragua · hombre</option>
    <option value="es-CO-SalomeNeural">Salomé · Colombia · mujer</option><option value="es-CO-GonzaloNeural">Gonzalo · Colombia · hombre</option>
    <option value="es-US-PalomaNeural">Paloma · EE. UU. latino · mujer</option><option value="es-US-AlonsoNeural">Alonso · EE. UU. latino · hombre</option>
    <option value="es-ES-ElviraNeural">Elvira · España · mujer</option><option value="es-ES-AlvaroNeural">Álvaro · España · hombre</option>
  </select></label>
  <label id="elKeyRow" hidden>Clave ElevenLabs <input type="password" id="kel" placeholder="sk_…" autocomplete="off" aria-label="Clave de ElevenLabs" class="mini" style="width:150px"></label>

  <button type="button" class="mini" id="probarVoz" title="Escuchar cómo suena la voz elegida">Probar voz</button>
  <label>Voz del navegador <select id="voice" aria-label="Voz del navegador"></select></label>
  <label>Velocidad <input type="range" id="rate" min="0.8" max="1.3" step="0.05" value="1.05"></label>
  <div id="perfilCfg" style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;border-top:1px solid #17304a;padding-top:8px;margin-top:4px">
    <strong style="flex-basis:100%">Sobre ti (CORA-IA lo tendrá siempre en cuenta)</strong>
    <label>Tu nombre <input type="text" id="pNombre" placeholder="Pedro" class="mini" style="width:140px" aria-label="Tu nombre"></label>
    <label>Dónde vives <input type="text" id="pLugar" placeholder="ciudad, país" class="mini" style="width:200px" aria-label="Dónde vives"></label>
    <label style="flex-basis:100%;display:flex;gap:8px;align-items:flex-start">Otras cosas <textarea id="pNotas" rows="3" maxlength="800" placeholder="Ej.: trabajo en una academia de idiomas; prefiero respuestas cortas…" class="mini" style="flex:1;min-width:220px;resize:vertical" aria-label="Otras cosas sobre ti"></textarea></label>
    <span style="flex-basis:100%;font-size:13px;opacity:.8">Se guarda solo en este PC, pero viaja al proveedor de IA (Groq, etc.) con cada mensaje. No escribas contraseñas ni datos privados.</span>
  </div>
  <div id="celCfg" style="flex-basis:100%;display:none;flex-wrap:wrap;gap:6px 18px;align-items:center;border-top:1px solid #17304a;padding-top:8px;margin-top:4px">
    <strong style="flex-basis:100%">Micrófono del celular</strong>
    <label><input type="checkbox" id="celActivo"> Activado</label>
    <span>Dirección del PC: <b id="celDir">…</b></span>
    <span>Código: <b id="celCod" style="letter-spacing:.15em">······</b></span>
    <button type="button" class="mini" id="celNuevo" title="Genera otro código de 6 números">Cambiar código</button>
    <span id="celEstado" style="flex-basis:100%;font-size:14px"></span>
  </div>
  </div>
</div>

<script src="websearch.js"></script>
<script>
/* =====================================================================
   CORA-IA 1.2 — asistente de IA conversacional
   Solo texto en este equipo; responde con voz. Cerebro en la nube (Groq por defecto)
   con búsqueda en internet integrada y control del navegador (Brave, Chrome, Edge).
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
let history = [], busy = false, speaking = false;

function setState(s, label) { document.body.dataset.state = s; $('#status').textContent = label; try { window.coraRemote && window.coraRemote.publicar({ estado: s, label }); } catch {} }
function addEl(cls, text, href) {
  const d = document.createElement(href ? 'a' : 'div');
  d.className = cls; d.textContent = text;
  if (href) { d.href = href; d.target = '_blank'; d.rel = 'noopener noreferrer'; }
  $('#log').appendChild(d); $('#log').scrollTop = 1e9;
}
const addLine = (role, text) => addEl('line ' + role, text);
const whenFree = (fn) => (busy || speaking) ? setTimeout(() => whenFree(fn), 1500) : fn();

/* ---------- Voz de salida ---------- */
let voices = [];
function loadVoices() {
  if (!window.speechSynthesis) return;
  voices = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith('es'));
  voices.sort((a, b) => /natural|online/i.test(b.name) - /natural|online/i.test(a.name));
  const sel = $('#voice'), saved = store.get('voice', '');
  sel.innerHTML = '';
  voices.forEach((v) => sel.add(new Option(v.name, v.name)));
  if (voices.some((v) => v.name === saved)) sel.value = saved;
  else if (voices.length) store.set('voice', sel.value); // se fija y ya no cambia sola
}
loadVoices();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
$('#voice').onchange = (e) => store.set('voice', e.target.value);

/* ---------- Versión instalada y actualizaciones (solo escritorio) ---------- */
if (window.elixApp) {
  let ver = '', upd = { estado: 'inicio' };
  const paint = () => {
    const t = { buscando: ' · buscando actualización…', descargando: ` · descargando${upd.version ? ' ' + upd.version : ''}${upd.pct ? ' ' + upd.pct + '%' : ''}…`,
      listo: ` · ${upd.version || 'nueva versión'} lista: clic para reiniciar`, 'al-dia': ' · al día ✓', error: ' · no pude buscar actualizaciones (clic para ver el motivo)', dev: ' · modo desarrollo' }[upd.estado] || '';
    $('#ver').textContent = ver ? 'v' + ver + t : '';
    $('#ver').title = upd.estado === 'error' && upd.detalle ? upd.detalle : 'Versión instalada (clic para buscar actualizaciones)';
  };
  elixApp.info().then((i) => { if (!i) return; ver = i.version; upd = i.status || upd; paint(); });
  elixApp.onUpdate((s) => { upd = s; paint(); });
  $('#ver').onclick = () => {
    if (upd.estado === 'listo') return elixApp.installNow();
    if (upd.estado === 'error' && upd.detalle) addLine('error', 'Actualización: ' + upd.detalle);
    elixApp.checkUpdate();
  };
}

function speakBrowser(text) {
  return new Promise((resolve) => {
    if (!text || $('#mute').checked) return resolve();
    if (window.coraTTS) { speaking = true; setState('speaking', 'Hablando'); window.coraTTS.speak(text, +$('#rate').value).catch(() => {}).finally(() => { speaking = false; resolve(); }); return; }
    if (!window.speechSynthesis) return resolve();
    speechSynthesis.cancel();
    const parts = (text.match(/[^.!?…]+[.!?…]*\s*/g) || [text]).map((p) => p.trim()).filter(Boolean);
    speaking = true; setState('speaking', 'Hablando');
    let i = 0;
    const next = () => {
      if (i >= parts.length || !speaking) { speaking = false; return resolve(); }
      const u = new SpeechSynthesisUtterance(parts[i++]);
      const v = voices.find((x) => x.name === $('#voice').value) || voices[0];
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'es-ES';
      u.rate = +$('#rate').value;
      u.onend = next; u.onerror = next;
      speechSynthesis.speak(u);
    };
    next();
  });
}
let ttsCool = 0, ttsSrc = null, ttsCtx = null;

function stopSpeaking() {
  speaking = false;
  try { speechSynthesis.cancel(); } catch {}
  try { window.coraTTS && window.coraTTS.stop(); } catch {}
  try { ttsSrc && ttsSrc.stop(); } catch {}
}
$('#orb').onclick = () => { if (speaking) stopSpeaking(); };

/* ---------- Voz principal: Edge (gratis) o ElevenLabs ---------- */
const ELID_DEF = '21m00Tcm4TlvDq8ikWAM';
if (!store.get('cora:tts-v2', '')) { store.set('jarvis:tts', 'edge'); store.set('cora:tts-v2', '1'); } // la voz de Gemini se retiró
$('#tts').value = store.get('jarvis:tts', 'edge'); if (!$('#tts').value) $('#tts').value = 'edge';
$('#evoice').value = store.get('cora:evoice', 'es-MX-DaliaNeural'); if (!$('#evoice').value) $('#evoice').value = 'es-MX-DaliaNeural';
$('#elid').value = store.get('jarvis:elid', ELID_DEF);
function verMotorVoz() { const e = $('#tts').value; $('#evoiceRow').hidden = e !== 'edge'; $('#elKeyRow').hidden = e !== 'eleven'; $('#elIdRow').hidden = e !== 'eleven'; }
$('#tts').onchange = (e) => { store.set('jarvis:tts', e.target.value); verMotorVoz(); };
$('#evoice').onchange = (e) => store.set('cora:evoice', e.target.value); // la voz elegida queda fija
$('#kel').onchange = (e) => store.set('jarvis:key:eleven', e.target.value.trim());
$('#elid').onchange = (e) => store.set('jarvis:elid', e.target.value.trim());
verMotorVoz();

// Trozos cortos (por frases): empieza a hablar antes y se pide el siguiente mientras suena el actual
function troceos(texto, max = 240) {
  const frases = String(texto).match(/[^.!?…]+[.!?…]*\s*/g) || [String(texto)], out = [];
  let cur = '';
  for (let f of frases) {
    f = f.trim(); if (!f) continue;
    while (f.length > max) { let i = f.lastIndexOf(', ', max); if (i < max * 0.4) i = f.lastIndexOf(' ', max); if (i < 1) i = max; if (cur) { out.push(cur); cur = ''; } out.push(f.slice(0, i + 1).trim()); f = f.slice(i + 1).trim(); }
    if ((cur + ' ' + f).trim().length > max && cur) { out.push(cur); cur = f; } else cur = (cur + ' ' + f).trim();
  }
  if (cur) out.push(cur);
  return out.length ? out : [String(texto).slice(0, max)];
}
// Devuelve true si habló, o el motivo (texto) si falló
async function speakCloud(text, engine) {
  speaking = true; setState('thinking', 'Preparando voz');
  try {
    const trozos = troceos(text);
    const pedir = (t) => window.coraVoz.sintetizar({ engine, text: t, voz: $('#evoice').value, rate: +$('#rate').value, key: keyOf('eleven'), voiceId: ($('#elid').value || ELID_DEF).trim() })
      .catch((e) => ({ ok: false, error: String((e && e.message) || e).slice(0, 100) }));
    let sig = pedir(trozos[0]);
    for (let i = 0; i < trozos.length; i++) {
      const r = await sig;
      if (i + 1 < trozos.length && speaking) sig = pedir(trozos[i + 1]); // se prepara el siguiente mientras suena este
      if (!speaking) return true; // lo interrumpieron
      if (!r || !r.ok) return (r && r.error) || 'sin respuesta';
      ttsCtx = ttsCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (ttsCtx.state === 'suspended') await ttsCtx.resume();
      const u8 = r.audio instanceof Uint8Array ? r.audio : new Uint8Array(r.audio);
      const buf = await ttsCtx.decodeAudioData(u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength));
      if (!speaking) return true;
      setState('speaking', 'Hablando');
      await new Promise((res) => { const src = ttsCtx.createBufferSource(); src.buffer = buf; src.connect(ttsCtx.destination); voiceLevelOn(ttsCtx, src); src.onended = res; ttsSrc = src; src.start(); });
    }
    return true;
  } catch (e) { return String((e && e.message) || e).slice(0, 100); }
  finally { ttsSrc = null; }
}
async function speak(text) {
  if (!text || $('#mute').checked) return;
  const eng = $('#tts').value;
  if ((eng === 'edge' || eng === 'eleven') && window.coraVoz) {
    // Una sola voz: si falla, NO se cambia a otra para que siempre suene igual.
    const r = await speakCloud(text, eng);
    speaking = false;
    if (r !== true && !speak.warned) {
      speak.warned = true; setTimeout(() => { speak.warned = false; }, 120000);
      addLine('error', `La voz de ${eng === 'edge' ? 'Edge' : 'ElevenLabs'} no respondió: ${r}. No cambio de voz para que siempre suene igual; si lo prefieres, elige «Navegador» en Motor de voz.`);
    }
    return;
  }
  return speakBrowser(text);
}
$('#probarVoz').onclick = async () => { stopSpeaking(); await speak('Hola, soy CORA. Así sueno ahora mismo. ¿Qué te parece mi voz?'); if (!busy) setState('idle', 'En espera'); };

// Nivel de la voz (0..1) para que el holograma "hable": --lvl en <body>
let lvlAn = null, lvlBuf = null, lvlRaf = 0;
function voiceLevelOn(ctx, src) {
  try {
    lvlAn = lvlAn || Object.assign(ctx.createAnalyser(), { fftSize: 512, smoothingTimeConstant: 0.6 });
    lvlBuf = lvlBuf || new Uint8Array(lvlAn.fftSize);
    src.connect(lvlAn);
    cancelAnimationFrame(lvlRaf);
    const tick = () => {
      lvlAn.getByteTimeDomainData(lvlBuf);
      let sum = 0; for (const v of lvlBuf) { const x = (v - 128) / 128; sum += x * x; }
      document.body.style.setProperty('--lvl', Math.min(1, Math.sqrt(sum / lvlBuf.length) * 5).toFixed(2));
      lvlRaf = requestAnimationFrame(tick);
    };
    tick();
    src.addEventListener('ended', () => { cancelAnimationFrame(lvlRaf); document.body.style.removeProperty('--lvl'); });
  } catch {}
}


const SITES = {
  google: (q) => 'https://www.google.com/search?q=' + encodeURIComponent(q),
  youtube: (q) => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q),
  maps: (q) => 'https://www.google.com/maps/search/' + encodeURIComponent(q),
  wikipedia: (q) => 'https://es.wikipedia.org/w/index.php?search=' + encodeURIComponent(q),
};
function beep(times = 3) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < times; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.35;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.start(t); o.stop(t + 0.3);
    }
  } catch {}
}
function openLink(url, label) {
  if (!/^https?:\/\//i.test(url)) return 'URL no válida: debe empezar con http:// o https://';
  try { if (window.coraOpen) window.coraOpen(url); else window.open(url, '_blank', 'noopener,noreferrer'); } catch {}
  addEl('chip', 'Abrir: ' + label, url);
  return 'Enlace preparado. Si el navegador bloqueó la ventana, el usuario puede pulsar el enlace que aparece en pantalla.';
}

// Llamada a la API. En la app de escritorio la hace el proceso principal (sin CORS); en la web, el navegador.
const NET_HOSTS = /^https:\/\/(api\.groq\.com|openrouter\.ai|generativelanguage\.googleapis\.com|www\.googleapis\.com)\//;
async function apiFetch(url, { headers = {}, body, form, timeout = 25000, method = 'POST' } = {}) {
  if (window.elixNet && NET_HOSTS.test(url)) {
    const r = await window.elixNet.fetch({ url, method, headers, body, form, timeout });
    if (!r || r.status === 0) { const e = new Error((r && r.body) || 'sin conexión'); e.name = r && r.aborted ? 'AbortError' : 'NetError'; throw e; }
    let data = {}; try { data = JSON.parse(r.body); } catch {}
    return { ok: r.status >= 200 && r.status < 300, status: r.status, data };
  }
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout);
  try {
    const init = { method, headers: { ...headers }, signal: ctl.signal };
    if (form) {
      const fd = new FormData();
      Object.entries(form.fields).forEach(([k, v]) => fd.append(k, v));
      fd.append('file', new Blob([form.file.bytes], { type: form.file.type }), form.file.name);
      init.body = fd;
    } else init.body = body;
    const r = await fetch(url, init);
    let data = {}; try { data = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data };
  } finally { clearTimeout(timer); }
}

function recortar(h) {
  while (h.length > 30) h = h.slice(2);
  let n = h.reduce((a, m) => a + m.content.length, 0);
  while (n > 24000 && h.length > 2) { n -= h[0].content.length + h[1].content.length; h = h.slice(2); }
  return h;
}

async function askLLM(msgs, tools) {
  const c = cfg();
  const defs = tools.map((t) => {
    const props = t.inputSchema.properties || {};
    const fn = { name: t.name, description: t.description };
    if (Object.keys(props).length) {
      fn.parameters = { type: 'object', properties: props };
      if (t.inputSchema.required && t.inputSchema.required.length) fn.parameters.required = t.inputSchema.required;
    }
    return { type: 'function', function: fn };
  });
  const P = PRESETS[c.prov];
  let model = c.model;
  const fallbacks = P.fallbacks || [];
  const timeoutMs = c.prov === 'groq' ? 50000 : 30000; // buscar en internet tarda más que responder de memoria
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const conBusqueda = (mdl) => c.prov === 'groq' && /gpt-oss/.test(mdl) && !SEARCH.off;
  async function post(messages) {
    const order = [model, ...fallbacks.filter((x) => x !== model)];
    let last = { status: 0, detail: '' };
    for (const mdl of order) {
      const more = order.indexOf(mdl) < order.length - 1;
      for (let attempt = 0; attempt < 2; attempt++) {
        const headers = { 'content-type': 'application/json' };
        if (c.key) headers.authorization = 'Bearer ' + c.key;
        const tl = conBusqueda(mdl) ? [...defs, { type: 'browser_search' }] : defs;
        const payload = { model: mdl, messages, max_tokens: c.prov === 'groq' ? 2500 : 1500, temperature: 0.5 };
        if (tl.length) payload.tools = tl;
        if (c.prov === 'groq' && /gpt-oss/.test(mdl)) payload.reasoning_effort = 'medium'; // piensa lo justo para ser preciso
        let r;
        $('#status').textContent = 'Consultando ' + mdl;
        try {
          r = await apiFetch(c.base + '/chat/completions', { headers, body: JSON.stringify(payload), timeout: timeoutMs });
        } catch (e) {
          if (e.name === 'AbortError') { last = { status: 0, detail: 'timeout' }; break; }
          throw { message: 'No pude conectar con el proveedor. Revisa tu internet o la URL.' };
        }
        const d = r.data;
        if (r.ok) {
          if (mdl !== c.model && last.status === 404) { $('#model').value = mdl; store.set('jarvis:model2:' + c.prov, mdl); }
          model = mdl; return d;
        }
        const info = { status: r.status, detail: (Array.isArray(d) ? d[0] : d)?.error?.message || '' };
        // Groq rechazó la búsqueda integrada: se sigue sin ella (solo en esta sesión) y se avisa una vez
        if (r.status === 400 && conBusqueda(mdl) && /browser_search|browser search|built-?in tool/i.test(info.detail)) {
          SEARCH.off = true; addEl('chip', 'La búsqueda en internet de Groq no estuvo disponible: sigo sin ella hasta que reinicies.');
          attempt = -1; continue;
        }
        if (r.status !== 404 || (!last.status && !last.detail)) last = info;
        if (r.status === 400 && more && /tool|function/i.test(last.detail)) break;
        if ([400, 401, 403].includes(r.status)) throw { message: r.status === 401 ? `La clave de ${P.name} no es válida. Revísala en el panel de API (botón «Ajustes»).` : `Error ${r.status}. ${last.detail}`.trim() };
        if (r.status === 404) break;
        if (r.status === 429 && more) break;
        if (attempt === 1) break;
        $('#status').textContent = 'Reintentando…';
        await wait(1200 * (attempt + 1));
      }
    }
    if (last.detail === 'timeout') throw { message: `El modelo tardó más de ${timeoutMs / 1000} segundos en responder. Prueba otra vez o cambia el modelo en el campo “Modelo”.` };
    if (last.status === 503 || last.status === 429) throw { message: `${P.name} está saturado o llegaste al límite gratuito. Prueba de nuevo en un minuto, o cambia de proveedor en el panel de API (botón «Ajustes»).` };
    throw { message: `Error ${last.status} del proveedor. ${last.detail}`.trim() };
  }
  // La fecha va en el último mensaje del usuario (no en el sistema) para que el inicio de la petición no cambie
  const stamp = new Date().toLocaleString('es', { dateStyle: 'full', timeStyle: 'short' });
  const base = msgs.map((m) => ({ role: m.role, content: m.content }));
  for (let i = base.length - 1; i >= 0; i--) if (base[i].role === 'user') { base[i].content = `[${stamp}] ${base[i].content}`; break; }
  const messages = [{ role: 'system', content: instrucciones() }, ...base];
  const calls = [];
  for (let i = 0; i < 6; i++) {
    const d = await post(messages);
    const m = d.choices?.[0]?.message;
    if (!m) throw { message: 'El proveedor no devolvió respuesta.' };
    const { reasoning, reasoning_content, executed_tools, ...am } = m; // lo interno no se reenvía
    messages.push(am);
    if (!m.tool_calls || !m.tool_calls.length) return { text: (m.content || '').replace(/<think>[\s\S]*?<\/think>/gi, '').trim(), calls };
    let cortado = false; // varios pasos en una frase: si uno falla, no se hacen los siguientes
    for (const call of m.tool_calls) {
      if (cortado) { messages.push({ role: 'tool', tool_call_id: call.id, name: call.function.name, content: 'NO EJECUTADO: un paso anterior falló, así que este no se hizo. Díselo al usuario.' }); continue; }
      const t = tools.find((x) => x.name === call.function.name);
      let input = {};
      try { input = JSON.parse(call.function.arguments || '{}'); } catch {}
      let out;
      try { out = t ? await t.execute(input) : 'Herramienta desconocida'; } catch (e) { out = 'Error: ' + (e.message || e); }
      out = typeof out === 'string' ? out : JSON.stringify(out);
      messages.push({ role: 'tool', tool_call_id: call.id, name: call.function.name, content: out });
      calls.push({ name: call.function.name, input, out });
      if (!out || FALLO.test(out)) cortado = true;
    }
  }
  return { text: 'Me enredé con tantos pasos. ¿Lo intentamos de nuevo?', calls };
}

/* ---------- Conversación ---------- */
// Lo que hace cada herramienta no se muestra en el chat: solo una etiqueta corta en la barra de estado
const ETIQUETA = { buscar_internet: (i) => 'Buscando: ' + String((i && i.consulta) || '').slice(0, 60), leer_pagina: () => 'Leyendo una página…', calcular: () => 'Calculando…', temporizador: () => 'Programando…' };
const herramientas = () => ALL_TOOLS.map((t) => ({
  name: t.name, description: t.description, inputSchema: t.inputSchema,
  execute: async (input) => {
    setState('acting', (ETIQUETA[t.name] || (() => t.name.startsWith('navegador') ? 'Usando el navegador…' : 'Ejecutando…'))(input));
    let out;
    try { out = await t.execute(input || {}); } catch (e) { out = 'Error: ' + (e.message || e); }
    setState('thinking', 'Pensando');
    return out;
  },
}));

async function send(text) {
  text = String(text || '').trim();
  if (!text || busy) return;
  const c = cfg();
  if (c.prov !== 'custom' && !c.key) { addLine('error', `Falta la clave gratuita de ${PRESETS[c.prov].name}. ${PRESETS[c.prov].help} Pégala en el campo “Clave” (pulsa «Ajustes» para mostrar la configuración de API).`); return; }
  if (!c.base) { addLine('error', 'Escribe la URL del proveedor en el campo “URL”.'); return; }
  stopSpeaking();
  busy = true; addLine('user', text); setState('thinking', 'Pensando');
  history.push({ role: 'user', content: text });
  let reply = '';
  try {
    const res = await askLLM(history, herramientas());
    reply = paraPantalla(res.text) || 'Listo.';
    history.push({ role: 'assistant', content: reply });
    history = recortar(history);
    addLine('jarvis', reply);
    try { window.coraRemote && window.coraRemote.publicar({ respuesta: reply }); } catch {}
  } catch (e) {
    history.pop();
    addLine('error', (e && e.message) || 'Error desconocido');
    reply = '';
  } finally { busy = false; }
  if (reply) await hablar(reply);
  if (!busy) setState('idle', 'En espera');
}
window.radexEnviar = send; // punto de entrada único: aquí llegarán también los mensajes del celular

function nuevaConversacion() { stopSpeaking(); history = []; $('#log').innerHTML = ''; setState('idle', 'En espera'); $('#text').focus(); }
$('#nuevo').onclick = nuevaConversacion;
$('#form').onsubmit = (e) => { e.preventDefault(); const t = $('#text').value; $('#text').value = ''; send(t); };
setState('idle', 'En espera');
{ const c0 = cfg(); if (c0.prov !== 'custom' && !c0.key) { $('#apiCfg').style.display = 'flex'; } if (c0.prov !== 'custom' && !c0.key) addLine('error', `Para empezar, pega tu clave gratuita de ${PRESETS[c0.prov].name}: pulsa «Ajustes» para abrir la configuración de API. ${PRESETS[c0.prov].help}`); }

/* ---------- Micrófono del celular (CORA Mic) ---------- */
if (window.coraRemote) {
  const R = window.coraRemote;
  $('#celCfg').style.display = 'flex';
  async function pintarCel() {
    let i = null; try { i = await R.config(); } catch {}
    if (!i) return;
    $('#celActivo').checked = !!i.activo;
    $('#celDir').textContent = i.ips && i.ips.length ? i.ips.join('  o  ') : 'sin Wi-Fi detectado';
    $('#celCod').textContent = i.codigo || '······';
    $('#celEstado').textContent = !i.activo ? 'Apagado: el celular no puede conectarse.'
      : i.error ? 'Error: ' + i.error
      : i.conectado ? 'Celular conectado.' : 'Esperando al celular (misma red Wi-Fi). Si Windows pregunta por el firewall, pulsa Permitir.';
  }
  $('#celActivo').onchange = async (e) => { await R.activar(e.target.checked); pintarCel(); };
  $('#celNuevo').onclick = async () => { await R.nuevoCodigo(); pintarCel(); };
  pintarCel(); setInterval(pintarCel, 3000);

  R.onCallar(() => stopSpeaking());
  R.onVoz(async (m) => {
    try {
      const key = keyOf('groq');
      if (!key) return R.responder(m.id, { error: 'Falta la clave de Groq en el PC (Ajustes).' });
      if (busy) return R.responder(m.id, { error: 'CORA-IA está ocupada. Intenta de nuevo en un momento.' });
      const bin = atob(m.audio), bytes = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      const mime = String(m.mime || 'audio/webm');
      const ext = /mp4|m4a|aac/.test(mime) ? 'm4a' : /ogg/.test(mime) ? 'ogg' : 'webm';
      setState('thinking', 'Escuchando');
      const r = await apiFetch('https://api.groq.com/openai/v1/audio/transcriptions', {
        headers: { Authorization: 'Bearer ' + key },
        form: { fields: { model: 'whisper-large-v3-turbo', language: 'es', response_format: 'json', temperature: '0' }, file: { bytes, type: mime, name: 'voz.' + ext } },
        timeout: 40000,
      });
      const texto = String((r.data && r.data.text) || '').trim();
      if (!r.ok || !texto) {
        setState('idle', 'En espera');
        return R.responder(m.id, { error: r.status === 401 ? 'La clave de Groq no es válida.' : !r.ok ? 'Groq no pudo entender el audio (error ' + r.status + ').' : 'No te entendí. Habla otra vez.' });
      }
      R.responder(m.id, { texto });
      send(texto);
    } catch (e) {
      setState('idle', 'En espera');
      R.responder(m.id, { error: 'No pude procesar el audio: ' + ((e && e.message) || e) });
    }
  });
}
