name: Publicar CORA-IA

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Usar como versión la de la etiqueta (v1.0.11 -> 1.0.11)
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que el repositorio tiene la parte de Android
        run: |
          for f in android/gradlew android/app/build.gradle android/app/cora.keystore android/gradle/wrapper/gradle-wrapper.jar app/mobile.js app/websearch.js; do
            [ -f "$f" ] || { echo "::error::Falta $f en el repositorio. Sube el proyecto completo (la web de GitHub solo admite 100 archivos por vez)."; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar el SDK de Android (ya viene en el servidor)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - name: Usar como versión la de la etiqueta
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "V=$V" >> "$GITHUB_ENV"
          sed -i "s/versionName \"1.0\"/versionName \"$V\"/; s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
      - run: npm install
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk "CORA-IA-$V.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: CORA-IA-*.apk
